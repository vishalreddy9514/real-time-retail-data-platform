version: 2

sources:
  - name: raw
    database: RETAIL_PLATFORM
    schema: raw
    tables:
      - name: stg_transactions
        loaded_at_field: _loaded_at
        freshness:
          warn_after: {count: 30, period: minute}
          error_after: {count: 2, period: hour}
        columns:
          - name: transaction_id
            tests:
              - not_null
              - unique
      - name: stg_customers
      - name: stg_products
      - name: stg_stores
