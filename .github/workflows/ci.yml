name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: pip install ruff==0.5.5 black==24.4.2
      - name: Ruff lint
        run: ruff check data_generator spark tests
      - name: Black format check
        run: black --check data_generator spark tests

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Generate reference data (needed by generator tests)
        run: python data_generator/reference_data.py
      - name: Run unit tests
        run: pytest tests/ -v --cov=data_generator --cov=spark --cov-report=term-missing

  dbt-tests:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: RETAIL_LOADER
      SNOWFLAKE_DATABASE: RETAIL_PLATFORM
      SNOWFLAKE_WAREHOUSE: RETAIL_WH
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dbt
        run: pip install dbt-core==1.8.3 dbt-snowflake==1.8.2
      - name: dbt deps
        working-directory: dbt
        run: dbt deps
      - name: dbt compile (validates SQL + refs without needing live data)
        working-directory: dbt
        run: dbt parse
        # Full `dbt run`/`dbt test` against a live Snowflake account is
        # intentionally left to a scheduled/manual workflow rather than
        # every PR, to avoid requiring warehouse credentials for every
        # external contributor and to control compute cost.
        if: ${{ env.SNOWFLAKE_ACCOUNT != '' }}

  validate-terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: Terraform init (backend-less validate)
        working-directory: terraform
        run: terraform init -backend=false
      - name: Terraform validate
        working-directory: terraform
        run: terraform validate
