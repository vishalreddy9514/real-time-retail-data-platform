# docker-compose.yml
#
# LOCAL DEVELOPMENT ONLY. This stands up a single-broker Kafka cluster,
# a Spark master+worker, and a minimal Airflow (LocalExecutor + Postgres)
# so the entire pipeline can be demoed on a laptop without any AWS spend.
# See architecture/ for the equivalent AWS PRODUCTION ARCHITECTURE
# (MSK/EMR/MWAA) this local stack is designed to mirror.

version: "3.8"

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.2-python3.11
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./spark:/opt/airflow/spark
    - ./dbt:/opt/airflow/dbt
    - ./data:/opt/airflow/data
    - airflow_logs:/opt/airflow/logs
  depends_on:
    - postgres

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  kafka-init-topics:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [kafka]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Kafka..." &&
        cub kafka-ready -b kafka:29092 1 30 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transactions --partitions 6 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic payments --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic refunds --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic customers --partitions 3 --replication-factor 1 --config cleanup.policy=compact &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic products --partitions 3 --replication-factor 1 --config cleanup.policy=compact &&
        echo "Topics created."

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on: [kafka]
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  spark-master:
    image: bitnamilegacy/spark:3.5.1
    environment:
      SPARK_MODE: master
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_TRANSACTIONS: transactions
      STORES_REFERENCE_PATH: /opt/spark-apps/data/reference/stores.csv
      RAW_LAKE_PATH: /opt/spark-apps/data/lake/raw/transactions
      BAD_RECORDS_PATH: /opt/spark-apps/data/lake/raw/bad_records
      AGG_MINUTE_PATH: /opt/spark-apps/data/lake/curated/sales_by_minute
      AGG_CITY_PATH: /opt/spark-apps/data/lake/curated/sales_by_city
      AGG_PRODUCT_PATH: /opt/spark-apps/data/lake/curated/product_performance
      ANOMALIES_PATH: /opt/spark-apps/data/lake/curated/anomalies
      CHECKPOINT_ROOT: /opt/spark-apps/data/checkpoints
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./spark:/opt/spark-apps
      - ./data:/opt/spark-apps/data

  spark-worker:
    image: bitnamilegacy/spark:3.5.1
    depends_on: [spark-master]
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    volumes:
      - ./spark:/opt/spark-apps
      - ./data:/opt/spark-apps/data

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      - airflow-init

  data-generator:
    build:
      context: .
      dockerfile: docker/Dockerfile.producer
    depends_on: [kafka-init-topics]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EVENTS_PER_SECOND: 5
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  postgres_data:
  airflow_logs:
